[package]
name = "cheetah-string-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
cheetah-string = { path = "..", features = ["bytes"] }
libfuzzer-sys = "0.4"

[[bin]]
name = "cheetah_string_transitions"
path = "fuzz_targets/cheetah_string_transitions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "split_differential"
path = "fuzz_targets/split_differential.rs"
test = false
doc = false
bench = false
