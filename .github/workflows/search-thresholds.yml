name: Search thresholds

# Times std and memchr::memmem substring search on x86_64 and aarch64 so the
# length thresholds in src/search.rs can be checked on each target. The
# tables are informational: they are written to the job summary and uploaded,
# and nothing fails on the numbers.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/search.rs"
      - "benches/search_thresholds.rs"
      - ".github/workflows/search-thresholds.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: measure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Build the benchmark
        run: cargo bench --bench search_thresholds --no-run

      - name: Time search strategies
        shell: bash
        run: |
          cargo bench --bench search_thresholds > "$RUNNER_TEMP/search-thresholds.md"
          cat "$RUNNER_TEMP/search-thresholds.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-thresholds-${{ runner.arch }}
          path: ${{ runner.temp }}/search-thresholds.md
          if-no-files-found: error
          retention-days: 30
